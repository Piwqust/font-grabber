[package]
name = "font-grabber"
version = "3.0.0"
edition = "2021"
description = "Website font scraper and converter"
license = "ISC"

[dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thirtyfour = "0.35"
tokio = { version = "1.44", features = ["full"] }
ttf-parser = "0.25"
url = "2.5"
wuff = { version = "0.2.3", features = ["z", "brotli"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
