[package]
name = "font-grabber"
version = "3.1.0"
edition = "2021"
description = "Website font scraper and converter"
license = "ISC"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
axum = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
futures = "0.3"
headless_chrome = "1.0"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thirtyfour = "0.35"
tokio = { version = "1.44", features = ["full"] }
ttf-parser = "0.25"
url = "2.5"
wuff = { version = "0.2.3", features = ["z", "brotli"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# The generated CDP bindings require excessive optimizer memory on small VPSes.
# Browser/network I/O dominates this adapter; keep font processing optimized.
[profile.release.package.headless_chrome]
opt-level = 0
codegen-units = 256
