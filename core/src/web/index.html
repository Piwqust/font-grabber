<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fount — Find your type</title>
    <meta
      name="description"
      content="Discover the fonts behind any website, compare live previews and download the faces you choose as clean TTF or OTF files."
    />
    <meta
      name="theme-color"
      content="#fbfbfa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c0c0e"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews for the hosted edition. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fount" />
    <meta property="og:title" content="Fount — Find your type" />
    <meta
      property="og:description"
      content="Discover the fonts behind any website, compare live previews and download the faces you choose as clean TTF or OTF files."
    />
    <meta property="og:image" content="/assets/fount-logo.svg" />
    <meta property="og:image:alt" content="The Fount wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fount — Find your type" />
    <meta
      name="twitter:description"
      content="Discover the fonts behind any website, compare live previews and download the faces you choose as clean TTF or OTF files."
    />
    <meta name="twitter:image" content="/assets/fount-logo.svg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      The saved theme is applied before the first paint. Doing this from the
      bundle would show one frame of the wrong palette.
    -->
    <script>
      try {
        var saved = localStorage.getItem("fount-theme");
        if (saved === "dark" || saved === "light")
          document.documentElement.setAttribute("data-theme", saved);
      } catch (error) {
        /* Storage can be blocked; the system preference still applies. */
      }
    </script>
    <link
      rel="preload"
      href="/assets/geist-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/geist-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/newsreader-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-hosted="__FOUNT_HOSTED__">
    <!--
      The shell paints the headline before the bundle runs, so the first frame is
      the page rather than an empty box. main.jsx clears it and mounts the app.
    -->
    <div id="root">
      <div class="boot">
        <h1 class="hero-title">
          Find the fonts<br /><em>behind</em> any website.
        </h1>
        <p class="hero-lede">
          Paste an address. Fount reads the page, groups what it finds into
          families, and hands you clean TTF or OTF files.
        </p>
      </div>
    </div>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        Fount needs JavaScript to scan a page and preview the fonts it finds.
      </p>
    </noscript>
    <style>
      .boot {
        display: grid;
        justify-items: center;
        gap: 1.4rem;
        min-height: 80vh;
        align-content: center;
        padding: 4rem 1.5rem;
        text-align: center;
      }
    </style>
    <script src="/app.js" defer></script>
  </body>
</html>
