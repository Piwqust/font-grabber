[package]
name = "font-grabber-rs"
version = "2.0.0"
edition = "2021"
description = "Rust rewrite of Font Grabber & Converter"
license = "ISC"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
futures = "0.3"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thirtyfour = "0.35"
tokio = { version = "1.44", features = ["full"] }
ttf-parser = "0.25"
url = "2.5"
wuff = "0.2.3"
